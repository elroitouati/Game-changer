name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download detection model
        run: ./scripts/fetch-model.sh

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::Missing secret SIGNING_KEYSTORE_BASE64 (see README)"; exit 1
          fi
          mkdir -p keystore
          echo "$KEY_B64" | base64 -d > keystore/shield.jks

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GameChanger.apk

      - name: Publish release (used by the in-app updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: גרסה 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: GameChanger.apk
